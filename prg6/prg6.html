<html>
<head>
<title>String Method and Math Object</title>
<style>
body {
text-align: center;
}
</style>
</head>
<body>
<script>
document.write("<h2>STRING METHODS</h2>");
let str = "i am KAVYA K";
document.write("JavaScript String Methods<br><br>");
document.write("String: " + str + "<br>");
document.write("Length of string is: " + str.length + "<br>");
document.write("Index of first occurrence of a: " + str.indexOf("a") + "<br>");
document.write("Index of last occurrence of a: " + str.lastIndexOf("a") + "<br>");
document.write("Index of am in string: " + str.indexOf("am") + "<br>");
document.write("Slice (0 to 3): " + str.slice(0, 4) + "<br>");
document.write("Substring (2 to 8): " + str.substring(2, 8) + "<br>");
document.write("Substr (2, 1): " + str.substr(2, 1) + "<br>");
document.write("String in uppercase: " + str.toUpperCase() + "<br>");
document.write("Replace Theertha with Kavya: " + str.replace("Theertha", "Kavya") + "<br>");
document.write("Use trim: " + str.trim() + "<br>");
document.write("Character at index 5: " + str.charAt(5) + "<br>");
document.write("ASCII/Unicode value of character at index 5: " + str.charCodeAt(5) + "<br><br>");
document.write("<h2>MATH OBJECT</h2>");
document.write("Math object is a built-in object that contains mathematical functions and constants.<br><br>");
document.write("Value of PI in radians: " + Math.PI + "<br>");
document.write("PI in degrees: " + (Math.PI * 180 / Math.PI) + "<br>");
document.write("Value of E: " + Math.E + "<br>");
document.write("Sign of -3: " + Math.sign(-3) + "<br>");
document.write("Square root of 8: " + Math.sqrt(8) + "<br>");
document.write("Second power of 8: " + Math.pow(8, 2) + "<br>");
document.write("Round value of 6.7: " + Math.round(6.7) + "<br>");
document.write("Round value of 4.6: " + Math.round(4.6) + "<br>");
document.write("Ceil value of 4.4: " + Math.ceil(4.4) + "<br>");
document.write("Ceil value of 4.6: " + Math.ceil(4.6) + "<br>");
document.write("Floor value of 4.4: " + Math.floor(4.4) + "<br>");
</script>
</body>
</html>

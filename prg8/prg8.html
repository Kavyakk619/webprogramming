<html>
<head>
<title>form</title>
<style>
.btn{
bordfer:none;
padding:10px 18px;
color:black;
background-color:cyan;
margin-left:18px;
border-radius:8px;
margin-top:14px;
cursor:pointer;
}
</style>
</head>
<body bgcolor="green">
<h1 align="center">FORM VALIDATION</h1>
<center>
<form name="form"action=""method="POST"onsubmit="return validate_form()">
<table>
<tr>
<td>name</td>
<td><input type="text"name="name"></td>
</tr>
<tr>
<td>email</td>
<td><input type="email"name="email"></td>
</tr>
<tr>
<td>mobile number</td>
<td><input type="trl"name="mobile"></td>
</tr>
<tr>
<tr>
<td>username</td>
<td><input type="text"name="user"></td>
</tr>
<td>password</td>
<td><input type="password"name="password"></td>
</tr>
<tr>
<td><nput type="reset"class="btn"value="reset"></td>
<td colspan="2"><input class="btn"type="submit"value="submit"></td>
</tr>
</table>
</form>
</center>
<script type="text/javascript">
function validate_form(){
var name=document.form.name.value;
var email=document.form.email.value;
var mobile=document.form.user.value;
var user=document.form.mobile.value;
var password=document.form.password.value;
var pattern=/^[a-zA-Z0-9._-]+@[a-zA-Z0-9.-]+\.[a_zA-Z]{2,4}$/;
if(name==""){
alert("name is required,enter name");
document.form.name.focus();
return false;
}
else if(pattern.test(name)){
alert("enter valid name");
document.form.name.focus();
}
if(email==""){
alert("enter email");
document.form.email.focus();
return false;
}
else if(!pattern.test(email)){
alert("enter a valid email");
}
if(mobile==""){
alert("enter mobile number");
document.form.mobile.focus();
return false;
}
else if(isNaN(mobile)){
alert("enter a valid mobile number");
return false;
}
if(user==""){
alert("enter username");
document.form.user.focus();
return false;
}
if password==""//password.length<8//!/(?=.*[a-z])(?=.*[A-Z])/.test(password)){
alert("enter minimum 8 characters and digits!!"+"at least one lowercase and uppercase&digit&special character must be included");
document.form.password.focus();
return false;
}
alert("form has been submitted");
}
</script>
</body>
</html>
